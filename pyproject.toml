[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nebraska-audit-validation"
version = "0.1.0"
description = "Independent validation for the Nebraska local-government financial database"
requires-python = ">=3.12"
dependencies = [
  "openpyxl==3.1.5",
]

[project.scripts]
nebraska-audit-baseline = "nebraska_audit_validation.baseline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
